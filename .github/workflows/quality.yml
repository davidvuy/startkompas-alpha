name: Quality
# The legacy Node runtime. See DECISIONS.md entry 1: it is frozen, so the
# six-way matrix no longer runs on every push. One job guards routine changes;
# the full matrix runs weekly and on demand.
#
# The skill has its own workflow, skill.yml, which needs no dependencies.
on:
  push:
    branches: [main, skill-first]
  pull_request:
  schedule:
    # Sundays 05:23 UTC — the full cross-platform matrix.
    - cron: '23 5 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Routine guard: the lowest supported Node on one OS. package.json allows
  # >=24, so this is the version most likely to catch an incompatibility.
  test:
    name: Tests (ubuntu, Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
          node-version: '24.x'

      # installation.json pins a SHA-256 for every file outside node_modules,
      # .git and skill/ — package-lock.json and these workflow files included.
      # A Dependabot pull request therefore invalidates it by construction, and
      # Dependabot cannot run the refresh. Before 2026-11-12 that meant every
      # bot pull request was permanently red and mailed on every run, which is
      # noise that teaches people to ignore CI. The manifest is still checked
      # on a bot pull request, and still reported, but it does not fail it: a
      # maintainer refreshes the manifest when merging the bump.
      - name: Verify package inventory
        if: github.actor != 'dependabot[bot]'
        run: node scripts/check-public-package.mjs
      - name: Verify package inventory (advisory for a dependency bump)
        if: github.actor == 'dependabot[bot]'
        continue-on-error: true
        run: node scripts/check-public-package.mjs
      - name: Install locked dependencies without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Product and security regressions
        run: npm test
      - name: Installation diagnostics
        run: node src/startkompas.mjs doctor --json
      - name: Fictional save and restore demo
        run: node examples/demo-offer-change.mjs ../startkompas-ci-demo
      - name: Fictional guided founder workflow
        run: node examples/demo-founder-workflow.mjs ../startkompas-founder-ci-demo

  # Full cross-platform coverage, kept but not paid for on every push.
  matrix:
    name: Tests (full matrix)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['26.7.0', '24.x']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
          node-version: ${{ matrix.node }}

      - name: Verify package inventory
        run: node scripts/check-public-package.mjs
      - name: Install locked dependencies without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Product and security regressions
        run: npm test
      - name: Installation diagnostics
        run: node src/startkompas.mjs doctor --json
      - name: Fictional save and restore demo
        run: node examples/demo-offer-change.mjs ../startkompas-ci-demo
      - name: Fictional guided founder workflow
        run: node examples/demo-founder-workflow.mjs ../startkompas-founder-ci-demo

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          package-manager-cache: false
          node-version: '24.x'

      # The repository-level scripts, and the tests over them. These belong in
      # the job that runs once rather than across the test matrix: they need no
      # dependencies, no network and no install step. Tests first — a link
      # checker that reports nothing is indistinguishable from a clean tree.
      # One of these tests asserts the manifest matches the tree, for the same
      # reason the step above does. Skipped by name on a bot pull request, so
      # the other 36 still run and still have to pass.
      - name: Tests for the repository scripts
        if: github.actor != 'dependabot[bot]'
        run: npm run test:scripts
      - name: Tests for the repository scripts (manifest assertion skipped)
        if: github.actor == 'dependabot[bot]'
        run: node --test --test-skip-pattern="public package manifest" scripts/*.test.mjs

      - name: Relative markdown links across the repository
        run: node scripts/check-doc-links.mjs

      - run: npm audit --omit=dev --audit-level=high

name: Quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['26.7.0', '24.x']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
      - name: Verify package inventory
        run: node scripts/check-public-package.mjs
      - name: Install locked dependencies without install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Product and security regressions
        run: npm test
      - name: Installation diagnostics
        run: node src/startkompas.mjs doctor --json
      - name: Fictional save and restore demo
        run: node examples/demo-offer-change.mjs ../startkompas-ci-demo
      - name: Fictional guided founder workflow
        run: node examples/demo-founder-workflow.mjs ../startkompas-founder-ci-demo
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.7.0'
      - run: npm audit --omit=dev --audit-level=high
